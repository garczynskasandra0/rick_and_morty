<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick & Morty API</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header>
        <h1>Rick & Morty</h1>
        <p>Lista postaci</p>
    </header>

    <main>

        <!--  komunikaty, np ładowanie -->
        
        <div id="wiadomosc"></div>

        <section id="postacie"></section>

        <div id="paginacja">

            <button id="poprzedniaStrona">
                ← Previous
            </button>
            <span id="informacjaOStronie">
                Page 1 / 1
            </span>

            <button id="nastepnaStrona">
                Next →
            </button>

        </div>

    </main>
    <script src="script.js"></script>
</body>
</html>
